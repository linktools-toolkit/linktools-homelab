services:
  multica:
    platform: linux/amd64
    user: '{{ DOCKER_UID }}:{{ DOCKER_GID }}'
    command: ["daemon", "start", "--foreground"]
    environment:
      - 'MULTICA_SERVER_URL={{ MULTICA_SERVER_URL }}'
      - 'MULTICA_APP_URL={{ MULTICA_APP_URL }}'
      - 'MULTICA_DAEMON_ID={{ MULTICA_DAEMON_ID }}'
      - 'MULTICA_WORKSPACES_ROOT=/workspace/.multica/workspaces'
    restart: unless-stopped
    volumes:
      - '{{ (APP_PATH/"home") | mkdir | chown(docker_user) }}:/workspace'
      - '{{ APP_PATH/"secrets/multica_pat" }}:/run/secrets/multica_pat:ro'
#   {% for name, path in containers["ai"].home_files.items() %}
      - '{{ path }}:/workspace/{{ name }}'
#   {% endfor %}
#   {% for name, path in containers["coder"].home_files.items() %}
      - '{{ path }}:/workspace/{{ name }}'
#   {% endfor %}
#   {% for name, path in containers["coder"].project_files.items() %}
      - '{{ path }}:/workspace/projects/{{ name }}'
#   {% endfor %}
