services:
  code-server:
    platform: linux/amd64
    user: '{{ DOCKER_UID }}:{{ DOCKER_GID }}'
    environment:
      - 'TZ=Asia/Singapore'
      - 'PASSWORD={{ VSCODE_PASSWORD }}'
      - 'ENTRYPOINTD=/entrypoint.d'
#     {% if container.proxy_url %}
      - 'VSCODE_PROXY_URI={{ container.proxy_url }}'
#     {% endif %}
#     {% for name, value in container.environment.items() %}
      - '{{ name }}={{ value }}'
#     {% endfor %}
    cap_add:
      - SYS_ADMIN
#   {% set service_ports = (['%d:8080' % (VSCODE_PORT | int)] if VSCODE_PORT | int > 0 else []) + (container.ports.items() | map('join', ':') | list) %}
#   {% if service_ports %}
    ports:
#     {% for entry in service_ports %}
      - '{{ entry }}'
#     {% endfor %}
#   {% endif %}
    volumes:
      - '{{ (APP_PATH/"home") | mkdir | chown(docker_user) }}:/workspace'
#     {% for name, path in containers["ai"].home_files.items() %}
      - '{{ path | mkdir | chown(docker_user) }}:/workspace/{{ name }}'
#     {% endfor %}
#     {% for name, path in containers["coder"].home_files.items() %}
      - '{{ path }}:/workspace/{{ name }}'
#     {% endfor %}
#     {% for name, path in containers["coder"].project_files.items() %}
      - '{{ path }}:/workspace/projects/{{ name }}'
#     {% endfor %}
#     {% for target, source in container.volumes.items() %}
      - '{{ source }}:{{ target }}:ro'
#     {% endfor %}
#   {% if NGINX_AUTH_ENABLE %}
    command: ["--auth", "none"]
#   {% endif %}
    networks:
      - nginx

networks:
  nginx:
