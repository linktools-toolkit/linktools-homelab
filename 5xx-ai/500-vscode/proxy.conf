{% from "nginx/headers.j2" import route_authorization, proxy_headers with context %}

location / {
    {{ route_authorization() }}
    {{ proxy_headers({"X-Forwarded-Prefix": "/proxy/$proxy_port"}) }}

    set $target_url "http://code-server:8080/proxy/$proxy_port$request_uri";
    proxy_pass $target_url;
    proxy_buffering off;
    proxy_buffer_size 4k;

    fastcgi_max_temp_file_size 10240m;
    client_max_body_size 10240m;
    proxy_connect_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    send_timeout 36000s;
}
