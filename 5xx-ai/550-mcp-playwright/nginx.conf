{% from "nginx/headers.j2" import proxy_headers with context %}

# MCP clients authenticate directly; do not redirect them to the SSO portal.
location = /mcp {
    auth_request off;
    if ($http_authorization != {{ nginx.quote("Bearer " + config.get("MCP_PLAYWRIGHT_TOKEN")) }}) {
        return 401;
    }

    {{ proxy_headers({"Authorization": ""}) }}
    proxy_http_version 1.1;
    # The token belongs to this gateway, not the upstream browser service.
    set $target_url "http://mcp-playwright:8931";
    proxy_pass $target_url;
    # Disables buffering/cache and supplies timeouts for streaming responses.
    {% include "nginx/params.conf" %}
}

# Protect both the noVNC page and its WebSocket connection with Authelia.
location / {
    {{ proxy_headers() }}
    proxy_http_version 1.1;
    set $target_url "http://mcp-playwright:6080";
    proxy_pass $target_url;
    {% include "nginx/params.conf" %}
}
