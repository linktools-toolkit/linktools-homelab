{% from "nginx/headers.j2" import route_authorization, proxy_headers with context %}

# The CLI probes the server URL before opening the browser for sign-in.
location = /health {
    auth_request off;
    {{ proxy_headers() }}
    set $target_url "http://multica-backend:8080";
    proxy_pass $target_url;
}

location = /readyz {
    auth_request off;
    {{ proxy_headers() }}
    set $target_url "http://multica-backend:8080";
    proxy_pass $target_url;
}

# Browser realtime WebSocket.
location = /ws {
    {{ route_authorization() }}
    {{ proxy_headers() }}
    proxy_http_version 1.1;
    set $target_url "http://multica-backend:8080";
    proxy_pass $target_url;
}

location ^~ /ws/ {
    {{ route_authorization() }}
    {{ proxy_headers() }}
    proxy_http_version 1.1;
    set $target_url "http://multica-backend:8080";
    proxy_pass $target_url;
}

# Daemon connections authenticate with Multica credentials, not Authelia.
location = /api/daemon/ws {
    auth_request off;
    {{ proxy_headers() }}
    proxy_http_version 1.1;
    set $target_url "http://multica-backend:8080";
    proxy_pass $target_url;
}

# The web frontend forwards the remaining API and login requests to the backend.
location ^~ /api/ {
    auth_request off;
    {{ proxy_headers() }}
    set $target_url "http://multica-frontend:3000";
    proxy_pass $target_url;
}

location / {
    {{ route_authorization() }}
    {{ proxy_headers() }}
    set $target_url "http://multica-frontend:3000";
    proxy_pass $target_url;
}
