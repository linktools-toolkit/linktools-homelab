{% set proxy_headers = "/etc/nginx/conf.d/snippets/header.conf" if WAF_ENABLE else "/etc/nginx/conf.d/snippets/header_all.conf" %}

# The CLI probes the server URL before opening the browser for sign-in.
location = /health {
    auth_request off;
    include {{ proxy_headers }};
    set $target_url "http://multica-backend:8080";
    proxy_pass $target_url;
    include /etc/nginx/conf.d/snippets/params.conf;
}

location = /readyz {
    auth_request off;
    include {{ proxy_headers }};
    set $target_url "http://multica-backend:8080";
    proxy_pass $target_url;
    include /etc/nginx/conf.d/snippets/params.conf;
}

# Browser realtime WebSocket.
location = /ws {
    {% if AUTH_ENABLE %}
    include /etc/nginx/conf.d/snippets/auth.conf;
    {% endif %}
    include {{ proxy_headers }};
    proxy_http_version 1.1;
    set $target_url "http://multica-backend:8080";
    proxy_pass $target_url;
    include /etc/nginx/conf.d/snippets/params.conf;
}

location ^~ /ws/ {
    {% if AUTH_ENABLE %}
    include /etc/nginx/conf.d/snippets/auth.conf;
    {% endif %}
    include {{ proxy_headers }};
    proxy_http_version 1.1;
    set $target_url "http://multica-backend:8080";
    proxy_pass $target_url;
    include /etc/nginx/conf.d/snippets/params.conf;
}

# Daemon connections authenticate with Multica credentials, not Authelia.
location = /api/daemon/ws {
    auth_request off;
    include {{ proxy_headers }};
    proxy_http_version 1.1;
    set $target_url "http://multica-backend:8080";
    proxy_pass $target_url;
    include /etc/nginx/conf.d/snippets/params.conf;
}

# The web frontend forwards the remaining API and login requests to the backend.
location ^~ /api/ {
    auth_request off;
    include {{ proxy_headers }};
    set $target_url "http://multica-frontend:3000";
    proxy_pass $target_url;
    include /etc/nginx/conf.d/snippets/params.conf;
}

location / {
    {% if AUTH_ENABLE %}
    include /etc/nginx/conf.d/snippets/auth.conf;
    {% endif %}
    include {{ proxy_headers }};
    set $target_url "http://multica-frontend:3000";
    proxy_pass $target_url;
    include /etc/nginx/conf.d/snippets/params.conf;
}
