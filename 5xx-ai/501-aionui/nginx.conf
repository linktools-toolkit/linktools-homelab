{% macro proxy_body() %}
    include /etc/nginx/conf.d/snippets/header_all.conf;
    proxy_set_header X-Cntr-Scheme "";
    proxy_set_header X-Cntr-Host "";
    proxy_set_header X-Cntr-URI "";
    proxy_set_header X-Cntr-Method "";
    proxy_set_header X-Cntr-Client-IP "";
    set $target_url "http://aionui:3000";
    proxy_pass $target_url;
    include /etc/nginx/conf.d/snippets/params.conf;
{% endmacro %}

{% if AUTH_ENABLE %}
location = /logout {
    default_type application/json;
    return 200 '{"success":true}';
}
{% endif %}

{% for regex in AUTH_BYPASS or () %}
location ~* {{ regex }} {
    {{ proxy_body() }}
    proxy_set_header X-Auth-User "";
    proxy_set_header X-Auth-Groups "";
    proxy_set_header X-Auth-Email "";
    proxy_set_header X-Auth-Name "";
}
{% endfor %}

location / {
    {{ proxy_body() }}
    {% if AUTH_ENABLE %}
    include /etc/nginx/conf.d/snippets/auth.conf;
    {% for name, value in (AUTH_HEADERS or {}).items() %}
    proxy_set_header {{ name }} {{ nginx_literal(value) }};
    {% endfor %}
    {% else %}
    proxy_set_header X-Auth-User "";
    proxy_set_header X-Auth-Groups "";
    proxy_set_header X-Auth-Email "";
    proxy_set_header X-Auth-Name "";
    {% endif %}
}
