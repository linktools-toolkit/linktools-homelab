{% from "nginx/headers.j2" import proxy_headers with context %}

{% macro proxy_body() %}
    {{ proxy_headers() }}
    set $target_url "http://aionui:3000";
    proxy_pass $target_url;
    {% include "nginx/params.conf" %}
{% endmacro %}

{% if site.auth %}
location = /logout {
    default_type application/json;
    return 200 '{"success":true}';
}
{% endif %}

{% for regex in site.auth_bypass or () %}
location ~* {{ regex }} {
    auth_request off;
    {{ proxy_body() }}
}
{% endfor %}

location / {
    {{ proxy_body() }}
}
