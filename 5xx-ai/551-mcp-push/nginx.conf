# Authentication is enforced by the MCP server, including direct connections.
location = /mcp {
    include /etc/nginx/conf.d/snippets/header_all.conf;
    proxy_http_version 1.1;
    set $target_url "http://mcp-push:8931";
    proxy_pass $target_url;
    include /etc/nginx/conf.d/snippets/params.conf;
}

location / {
    return 404;
}
