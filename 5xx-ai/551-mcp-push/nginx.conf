{% from "nginx/headers.j2" import proxy_headers with context %}

# Authentication is enforced by the MCP server, including direct connections.
location = /mcp {
    {{ proxy_headers() }}
    proxy_http_version 1.1;
    set $target_url "http://mcp-push:8931";
    proxy_pass $target_url;
    {% include "nginx/params.conf" %}
}

location / {
    return 404;
}
