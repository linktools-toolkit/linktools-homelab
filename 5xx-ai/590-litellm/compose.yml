services:
  litellm:
    image: 'ghcr.io/berriai/litellm:{{ LITELLM_TAG }}'
    command: ['--config', '/app/config.yaml', '--detailed_debug']
    environment:
      - 'TZ=Asia/Singapore'
      - 'LITELLM_MASTER_KEY={{ LITELLM_MASTER_KEY }}'
      - 'LITELLM_SALT_KEY={{ LITELLM_SALT_KEY }}'
      - 'DATABASE_URL=postgresql://{{ LITELLM_DB_USERNAME }}:{{ LITELLM_DB_PASSWORD }}@{{ LITELLM_DB_HOST }}:{{ LITELLM_DB_PORT }}/{{ LITELLM_DB_DATABASE }}'
      - 'PROXY_BASE_URL={{ utils.make_url("https", LITELLM_DOMAIN, NGINX_HTTPS_PORT) }}'
#     {% if NGINX_AUTH_ENABLE %}
#     {% with client = manager.containers['authelia'].oidc_clients[0] %}
      - 'GENERIC_CLIENT_ID={{ client["ClientID"] }}'
      - 'GENERIC_CLIENT_SECRET={{ client["ClientSecret"] }}'
      - 'GENERIC_AUTHORIZATION_ENDPOINT={{ client["IssuerURL"] }}/api/oidc/authorization'
      - 'GENERIC_TOKEN_ENDPOINT={{ client["IssuerURL"] }}/api/oidc/token'
      - 'GENERIC_USERINFO_ENDPOINT={{ client["IssuerURL"] }}/api/oidc/userinfo'
#     {% endwith %}
#     {% endif %}
#   {% if LITELLM_PORT > 0 %}
    ports:
      - '{{ LITELLM_PORT }}:4000'
#   {% endif %}
    volumes:
      - '{{ (APP_PATH/"data") | mkdir | chown }}:/data'
      - '{{ SOURCE_PATH/"config.yaml" }}:/app/config.yaml:ro'
    networks:
      - nginx
      - litellm
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4000/health/liveliness']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
#   {% if LITELLM_DB_HOST == 'litellm-postgres' %}
    depends_on:
      - litellm-postgres
#   {% endif %}

# {% if LITELLM_DB_HOST == 'litellm-postgres' %}
  litellm-postgres:
    image: postgres:16-alpine
    volumes:
      - '{{ (APP_PATH/"postgres") | mkdir | chown }}:/var/lib/postgresql/data'
    environment:
      POSTGRES_DB: '{{ LITELLM_DB_DATABASE }}'
      POSTGRES_USER: '{{ LITELLM_DB_USERNAME }}'
      POSTGRES_PASSWORD: '{{ LITELLM_DB_PASSWORD }}'
    networks:
      - litellm
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U {{ LITELLM_DB_USERNAME }} -d {{ LITELLM_DB_DATABASE }}']
      interval: 10s
      timeout: 5s
      retries: 5
#   {% endif %}

networks:
  nginx:
  litellm:
