services:
  cloud-cli:
    build:
      context: '{{ container.code_path }}'
      dockerfile: '{{ container.get_docker_file_path() }}'
#   {% if CLOUD_CLI_PORT > 0 %}
    ports:
      - '{{ CLOUD_CLI_PORT }}:3001'
#   {% endif %}
    environment:
      - NODE_ENV=production
      - VITE_IS_PLATFORM={{ 'true' if NGINX_AUTH_ENABLE else 'false' }}
    user: '{{ DOCKER_UID }}:{{ DOCKER_GID }}'
    volumes:
      - '{{ (APP_PATH/"data") | mkdir | chown(docker_user) }}:/app/data'
      - '{{ CODER_PROJECT_PATH }}:/workspace/projects'
      {% for name, path in containers["coder"].home_files.items() -%}
      - '{{ path }}:/workspace/{{ name }}'
      {% endfor %}
    networks:
      nginx:

networks:
  nginx:
