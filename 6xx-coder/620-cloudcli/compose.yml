services:
  cloudcli:
    build:
      context: '{{ container.get_docker_context_path() }}'
      dockerfile: '{{ container.get_docker_file_path() }}'
#     {% if NGINX_AUTH_ENABLE %}
      args:
        VITE_IS_PLATFORM: "true"
#     {% endif %}
#   {% if CLOUD_CLI_PORT > 0 %}
    ports:
      - '{{ CLOUD_CLI_PORT }}:3001'
#   {% endif %}
    user: '{{ DOCKER_UID }}:{{ DOCKER_GID }}'
    volumes:
      - '{{ (APP_PATH/"home") | mkdir | chown(docker_user) }}:/workspace'
#     {% if NGINX_AUTH_ENABLE %}
      - '/workspace/.cloudcli/auth'
#     {% endif %}
#     {% for name, path in containers["coder"].home_files.items() %}
      - '{{ path }}:/workspace/{{ name }}'
#     {% endfor %}
#     {% for name, path in containers["coder"].project_files.items() %}
      - '{{ path }}:/workspace/projects/{{ name }}'
#     {% endfor %}
    networks:
      nginx:

networks:
  nginx:
