{% from "nginx/headers.j2" import proxy_headers with context %}

location /pypi {
    {{ proxy_headers() }}
    # Replace exactly the /pypi prefix with /, retaining the query string.
    set $pypi_backend "http://pypi-server:8080";
    rewrite ^/pypi(.*)$ /$1 break;
    proxy_pass $pypi_backend;
}

location ~ ((?:simple|packages).*) {
    {{ proxy_headers() }}
    # The original capture-based URI deliberately does not append $args.
    set $pypi_target "http://pypi-server:8080/$1";
    proxy_pass $pypi_target;
}
