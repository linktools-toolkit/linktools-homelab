services:
  gitlab:
    image: 'gitlab/gitlab-ce:{{ GITLAB_TAG }}'
    environment:
      GITLAB_ROOT_PASSWORD: '{{ GITLAB_ROOT_PASSWORD }}'
      GITLAB_OMNIBUS_CONFIG: |
          external_url 'https://{{ GITLAB_DOMAIN }}:{{ NGINX_HTTPS_PORT }}'
          gitlab_rails['gitlab_shell_ssh_port'] = {{ GITLAB_SSH_PORT }}

          # nginx['enable'] = true
          # nginx['listen_port'] = 80
          # nginx['listen_https'] = false
          nginx['enable'] = false
          nginx['listen_https'] = false
          nginx['redirect_http_to_https'] = false
          nginx['status'] = { 'enable' => false }
          gitlab_workhorse['listen_network'] = "tcp"
          gitlab_workhorse['listen_addr'] = "0.0.0.0:8181"

          postgresql['enable'] = false
          gitlab_rails['db_adapter'] = "postgresql"
          gitlab_rails['db_encoding'] = "utf8"
          gitlab_rails['db_host'] = "{{ GITLAB_DB_HOST }}"
          gitlab_rails['db_port'] = "{{ GITLAB_DB_PORT }}"
          gitlab_rails['db_database'] = "{{ GITLAB_DB_DATABASE }}"
          gitlab_rails['db_username'] = "{{ GITLAB_DB_USERNAME }}"
          gitlab_rails['db_password'] = "{{ GITLAB_DB_PASSWORD }}"

          redis['enable'] = false
          gitlab_rails['redis_host'] = "{{ GITLAB_REDIS_HOST }}"
          gitlab_rails['redis_port'] = "{{ GITLAB_REDIS_PORT }}"
          gitlab_rails['redis_password'] = "{{ GITLAB_REDIS_PASSWORD }}"

          letsencrypt['enable'] = false
          registry['enable'] = false

          # if you don't use Kubernetes
          gitlab_kas['enable'] = false

          # 关闭监控
          prometheus['enable'] = false
          alertmanager['enable'] = false
          node_exporter['enable'] = false
          redis_exporter['enable'] = false
          postgres_exporter['enable'] = false
          pgbouncer_exporter['enable'] = false
          gitlab_exporter['enable'] = false
          prometheus_monitoring['enable'] = false
          # grafana['enable'] = false
          sidekiq['metrics_enabled'] = false

          # 禁用 PUMA 集群模式
          puma['worker_processes'] = 0
          puma['min_threads'] = 1
          puma['max_threads'] = 2

          # 降低后台守护进程并发数
          sidekiq['concurrency'] = 5

          gitlab_ci['gitlab_ci_all_broken_builds'] = false
          gitlab_ci['gitlab_ci_add_pusher'] = false

          # Usage Statistics
          gitlab_rails['usage_ping_enabled'] = false
          gitlab_rails['sentry_enabled'] = false
          # grafana['reporting_enabled'] = false

          logging['logrotate_frequency'] = "daily"
          logging['logrotate_rotate'] = 7
          logging['logrotate_compress'] = "compress"
          logging['logrotate_method'] = "copytruncate"
          logging['logrotate_maxsize'] = "200M"

          # {% if NGINX_AUTH_ENABLE %}
          # {% with client = manager.containers['authelia'].oidc_clients[0] %}
          gitlab_rails['omniauth_providers'] = [
            {
              name: "openid_connect",
              label: "sso",
              icon: "https://www.authelia.com/images/branding/logo-cropped.png",
              args: {
                name: "openid_connect",
                strategy_class: "OmniAuth::Strategies::OpenIDConnect",
                issuer: "{{ client['IssuerURL'] }}",
                discovery: true,
                scope: ["openid","profile","email","groups"],
                client_auth_method: "basic",
                response_type: "code",
                response_mode: "query",
                uid_field: "preferred_username",
                send_scope_to_token_endpoint: true,
                pkce: true,
                client_options: {
                  identifier: "{{ client['ClientID'] }}",
                  secret: "{{ client['ClientSecret'] }}",
                  redirect_uri: "{{ utils.make_url("https", GITLAB_DOMAIN, NGINX_HTTPS_PORT, "/users/auth/openid_connect/callback") }}"
                }
              }
            }
          ]
          # {% endwith %}
          # {% endif %}

    ports:
      - '{{ GITLAB_SSH_PORT }}:22'
    volumes:
      - '{{ (APP_PATH/"config") | mkdir | chown }}:/etc/gitlab'
      - '{{ (APP_PATH/"logs") | mkdir | chown }}:/var/log/gitlab'
      - '{{ (APP_PATH/"data") | mkdir | chown }}:/var/opt/gitlab'
      - '{{ (APP_DATA_PATH/"data"/"git-data") | mkdir | chown }}:/var/opt/gitlab/git-data'
    networks:
      - nginx
      - gitlab
#   {% if GITLAB_DB_HOST == 'gitlab-postgres' or GITLAB_REDIS_HOST == 'gitlab-redis' %}
    depends_on:
#     {% if GITLAB_DB_HOST == 'gitlab-postgres' %}
      - gitlab-postgres
#     {% endif %}
#     {% if GITLAB_REDIS_HOST == 'gitlab-redis' %}
      - gitlab-redis
#     {% endif %}
#   {% endif %}

# {% if GITLAB_DB_HOST == 'gitlab-postgres' %}
  gitlab-postgres:
    image: postgres:16-alpine
    volumes:
      - '{{ (APP_PATH/"postgres") | mkdir | chown }}:/var/lib/postgresql/data'
    environment:
      POSTGRES_DB: '{{ GITLAB_DB_DATABASE }}'
      POSTGRES_USER: '{{ GITLAB_DB_USERNAME }}'
      POSTGRES_PASSWORD: '{{ GITLAB_DB_PASSWORD }}'
    networks:
      - gitlab
#   {% endif %}

# {% if GITLAB_REDIS_HOST == 'gitlab-redis' %}
  gitlab-redis:
    image: redis:alpine
    command: redis-server --requirepass {{ GITLAB_REDIS_PASSWORD }}
    networks:
      - gitlab
# {% endif %}

networks:
  nginx:
  gitlab:
