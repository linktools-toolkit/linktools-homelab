{% from "nginx/headers.j2" import route_authorization, proxy_headers with context %}

location / {
    {{ route_authorization() }}
    proxy_http_version 1.1;
    {{ proxy_headers({"Host": "127.0.0.1:8080", "Referer": "", "Origin": ""}) }}
    proxy_cookie_path / "/; Secure";
    proxy_hide_header Referer;
    proxy_hide_header Origin;

    set $qbittorrent_backend "http://qbittorrent:8080";
    proxy_pass $qbittorrent_backend;
}
