{% from 'nginx/headers.j2' import proxy_headers, route_authorization with context %}
location / {
    {{ route_authorization() | indent(4) }}
    {{ proxy_headers({'REMOTE_USER': 'guacadmin'}) | indent(4) }}
    proxy_http_version 1.1;
    set $guacamole_upstream "http://guacamole:8080";
    proxy_pass $guacamole_upstream;
}
