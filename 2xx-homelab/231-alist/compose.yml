services:
  alist:
    image: 'xhofe/alist:{{ ALIST_TAG }}'
    volumes:
      - '{{ (APP_DATA_PATH/"config") | mkdir | chown }}:/opt/alist/data'
      - '{{ ALIST_DATA_PATH }}:/data'
#   {% if ALIST_PORT > 0 %}
    ports:
      - '{{ ALIST_PORT }}:5244'
#   {% endif %}
    environment:
      - PUID=0
      - PGID=0
      - UMASK=022
      - ALIST_ADMIN_PASSWORD={{ ALIST_ADMIN_PASSWORD }}
    networks:
      - nginx

networks:
  nginx:
