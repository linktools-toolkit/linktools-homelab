# 反代终止 TLS 后以 http:8000 转发到本机，nginx 默认会用内部 scheme/端口拼绝对跳转，
# 导致 301 跳到 http://xxx:8000/dav/ 被浏览器当作跨协议/跨端口拦截。
# 关闭绝对跳转，发相对 Location，让浏览器按原始 https 地址解析。
absolute_redirect off;

# 访问 /dav 自动补斜杠
location = /dav {
    return 301 /dav/;
}

location /dav/ {
    include /etc/nginx/conf.d/snippets/header.conf;
    include /etc/nginx/conf.d/snippets/params.conf;

    # 上游 WebDAV 在根路径，转发时剥掉 /dav 前缀
    rewrite ^/dav/(.*)$ /$1 break;

    # COPY / MOVE 的 Destination 头同样剥掉 /dav 前缀
    set $dav_destination $http_destination;
    if ($http_destination ~* "^https?://[^/]+/dav(/.*)$") {
        set $dav_destination $1;
    }
    proxy_set_header Destination $dav_destination;

    # 关闭上游压缩，便于重写响应体里的绝对路径
    proxy_set_header Accept-Encoding "";

    # 上游返回的 href 是根绝对路径，需补回 /dav 前缀，否则客户端导航错乱
    sub_filter_types text/xml application/xml;
    sub_filter_once off;
    sub_filter '<D:href>/' '<D:href>/dav/';
    sub_filter '<d:href>/' '<d:href>/dav/';

    proxy_pass {{ FNOS_DAV_LOCAL_URL }};
}

location / {
    include /etc/nginx/conf.d/snippets/header.conf;
    include /etc/nginx/conf.d/snippets/params.conf;
    proxy_pass {{ FNOS_LOCAL_URL }};
}
