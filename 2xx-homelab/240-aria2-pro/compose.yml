services:
  aria2-pro:
    image: p3terx/aria2-pro:{{ ARIA2_TAG }}
    environment:
      - 'PUID={{ DOCKER_UID }}'
      - 'PGID={{ DOCKER_GID }}'
      - 'UMASK_SET=022'
      - 'RPC_SECRET={{ ARIA2_RPC_SECRET }}'
      - 'RPC_PORT=6800'
      - 'LISTEN_PORT=6888'
#    {% if ARIA2_PORT > 0 %}
    ports:
      - '{{ ARIA2_PORT }}:6800'
#    {% endif %}
    volumes:
      - '{{ (APP_PATH/"config") | mkdir | chown(docker_user) }}:/config'
      - '{{ (DOCKER_DOWNLOAD_PATH/"aria2") | mkdir | chown(docker_user) }}:/downloads'
    networks:
      - nginx

networks:
  nginx:
