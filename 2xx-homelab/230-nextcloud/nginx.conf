{% from "nginx/headers.j2" import proxy_headers with context %}

add_header Strict-Transport-Security 'max-age=15552000';

location / {
    allow all;
    proxy_redirect off;
    {{ proxy_headers({"X-Forwarded-Ssl": "on"}) }}
    set $nextcloud_backend "http://nextcloud:80";
    proxy_pass $nextcloud_backend;

    proxy_buffering off;
    proxy_buffer_size 4k;

    fastcgi_max_temp_file_size 10240m;
    client_max_body_size 10240m;
    proxy_connect_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    send_timeout 36000s;
}

location ^~ /onlyoffice/ {
    proxy_http_version 1.1;
    {{ proxy_headers({"X-Forwarded-Host": "$cntr_host/onlyoffice", "Connection": "upgrade"}) }}

    # Keep the former trailing-slash prefix replacement and original query.
    set $onlyoffice_backend "http://nextcloud-onlyoffice:80";
    rewrite ^/onlyoffice/(.*)$ /$1 break;
    proxy_pass $onlyoffice_backend;
}

location ^~ /.well-known {
    # The following rules are borrowed from `.htaccess`.
    location = /.well-known/carddav     { return 301 $cntr_scheme://$cntr_host/remote.php/dav/; }
    location = /.well-known/caldav      { return 301 $cntr_scheme://$cntr_host/remote.php/dav/; }
    # Anything else is dynamically handled by Nextcloud.
    location ^~ /.well-known            { return 301 $cntr_scheme://$cntr_host/index.php$uri; }

    try_files $uri $uri/ =404;
}
