services:
  xray-server:
    image: 'ghcr.io/xtls/xray-core:{{ XRAY_TAG }}'
    command: ["run", "-c", "/etc/xray/config.json"]
    group_add:
      - '{{ DOCKER_GID }}'
    volumes:
      - '{{ APP_PATH/"generated/current/config.json" }}:/etc/xray/config.json:ro'
    networks:
      - nginx

networks:
  nginx: