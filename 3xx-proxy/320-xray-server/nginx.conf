{% from "nginx/headers.j2" import route_authorization, proxy_headers, grpc_headers with context %}

http2 on;

location = {{ nginx.complex_value(vars.websocket_path) }} {
    {{ route_authorization() }}
    if ($http_upgrade != "websocket") {
        return 404;
    }
    set $xray_ws_backend "http://xray-server:9000";
    proxy_pass $xray_ws_backend$request_uri;
    proxy_redirect off;
    proxy_http_version 1.1;
    {{ proxy_headers({"Connection": "upgrade"}) }}
    proxy_read_timeout 52w;
}

location = {{ nginx.complex_value(vars.grpc_path) }} {
    {{ route_authorization() }}
    if ($content_type !~ "application/grpc") {
        return 404;
    }

    set $xray_grpc_backend "grpc://xray-server:9001";
    grpc_pass $xray_grpc_backend;
    grpc_read_timeout            1h;
    grpc_send_timeout            1h;
    {{ grpc_headers({"Connection": "", "Upgrade": ""}) }}
    grpc_socket_keepalive        on;

    client_body_buffer_size      1m;
    client_body_timeout          1h;
    client_max_body_size         0;
}

location ~ {{ nginx.complex_value(vars.grpc_pattern) }} {
    {{ route_authorization() }}
    if ($content_type !~ "application/grpc") {
        return 404;
    }

    set $xray_grpc_backend "grpc://xray-server:9001";
    grpc_pass $xray_grpc_backend;
    grpc_read_timeout            1h;
    grpc_send_timeout            1h;
    {{ grpc_headers({"Connection": "", "Upgrade": ""}) }}
    grpc_socket_keepalive        on;

    client_body_buffer_size      1m;
    client_body_timeout          1h;
    client_max_body_size         0;
}

location ^~ {{ nginx.complex_value(vars.xhttp_path) }} {
    {{ route_authorization() }}
    client_max_body_size             0;
    client_body_timeout             5m;
    {{ grpc_headers({"Connection": "", "Upgrade": ""}) }}
    grpc_read_timeout               315s;
    grpc_send_timeout               5m;
    set $xray_xhttp_backend "grpc://xray-server:9002";
    grpc_pass $xray_xhttp_backend;
}
