{% from "nginx/headers.j2" import route_authorization, proxy_headers with context %}

location ^~ /c/ {
    auth_request off;
    {{ proxy_headers() }}
    set $target_url "http://sublink-pro:8000";
    proxy_pass $target_url;
}

location ~* \.(css|js|webmanifest)$ {
    auth_request off;
    {{ proxy_headers() }}
    set $target_url "http://sublink-pro:8000";
    proxy_pass $target_url;
}

{% if site.auth %}
{% if config.get("SUBLINK_API_KEY") %}
# The gateway injects X-API-Key for passwordless access, but upstream only
# allows real login sessions on the AI-assistant endpoints (they read/store
# the upstream LLM key). Serve a clean "not configured" GET to the panel and
# reject the mutating ones instead of forwarding a doomed 403.
location = /api/v1/settings/ai-assistant {
    {{ route_authorization() }}
    default_type application/json;
    return 200 '{"code":200,"msg":"操作成功","data":{"enabled":false,"configured":false,"hasKey":false}}';
}
location ~ ^/api/v1/settings/ai-assistant/(models|test)$ {
    {{ route_authorization() }}
    default_type application/json;
    return 200 '{"code":403,"msg":"AI 助手设置仅支持登录会话访问，请先登录管理账号","data":null}';
}
location ^~ /api/v1/settings/ai-assistant/ {
    {{ route_authorization() }}
    default_type application/json;
    return 200 '{"code":403,"msg":"AI 助手设置仅支持登录会话访问，请先登录管理账号","data":null}';
}
{% endif %}
{% endif %}

location / {
    {{ route_authorization() }}
    {{ proxy_headers() }}
    {% if site.auth %}
    {% if config.get("SUBLINK_API_KEY") %}
    proxy_set_header X-API-Key {{ nginx.quote(config.get("SUBLINK_API_KEY")) }};
    proxy_set_header Accept-Encoding "";
    sub_filter_once on;
    sub_filter '</head>' '<script>if(!localStorage.getItem("accessToken"))localStorage.setItem("accessToken","{{ container.project_name }}");</script></head>';
    {% endif %}
    {% endif %}
    set $target_url "http://sublink-pro:8000";
    proxy_pass $target_url;
}
