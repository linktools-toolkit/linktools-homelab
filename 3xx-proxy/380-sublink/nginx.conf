{% from "nginx/headers.j2" import route_authorization, proxy_headers with context %}

location ^~ /c/ {
    auth_request off;
    {{ proxy_headers() }}
    set $target_url "http://sublink-pro:8000";
    proxy_pass $target_url;
}

location ~* \.(css|js|webmanifest)$ {
    auth_request off;
    {{ proxy_headers() }}
    set $target_url "http://sublink-pro:8000";
    proxy_pass $target_url;
}

location / {
    {{ route_authorization() }}
    {{ proxy_headers() }}
    {% if site.auth %}
    {% if config.get("SUBLINK_API_KEY") %}
    proxy_set_header X-API-Key {{ nginx.quote(config.get("SUBLINK_API_KEY")) }};
    proxy_set_header Accept-Encoding "";
    sub_filter_once on;
    sub_filter '</head>' '<script>if(!localStorage.getItem("accessToken"))localStorage.setItem("accessToken","{{ container.project_name }}");</script></head>';
    {% endif %}
    {% endif %}
    set $target_url "http://sublink-pro:8000";
    proxy_pass $target_url;
    {% include "nginx/params.conf" %}
}
