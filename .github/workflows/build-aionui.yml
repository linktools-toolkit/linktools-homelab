name: Build AionUI

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'AionUI tag to build (leave empty to use latest release)'
        required: false
      force:
        description: 'Force rebuild even if image already exists'
        required: false
        default: 'false'
        type: boolean

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      channel: ${{ steps.resolve.outputs.channel }}
      asset-url: ${{ steps.resolve.outputs.asset-url }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - name: Resolve release info
        id: resolve
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            RELEASE=$(curl -sf "https://api.github.com/repos/iOfficeAI/AionUi/releases/tags/${{ inputs.tag }}")
          else
            RELEASE=$(curl -sf "https://api.github.com/repos/iOfficeAI/AionUi/releases" | jq 'first')
          fi

          TAG=$(echo "$RELEASE" | jq -r .tag_name)
          VERSION=$(echo "$TAG" | sed 's/^v//' | cut -d'-' -f1)
          IS_PRERELEASE=$(echo "$RELEASE" | jq -r .prerelease)
          CHANNEL=$([ "$IS_PRERELEASE" = "true" ] && echo "preview" || echo "stable")
          ASSET_URL=$(echo "$RELEASE" | jq -r '.assets[] | select(.name | test("linux-x86_64\\.tar\\.gz$")) | .browser_download_url')

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT
          echo "asset-url=$ASSET_URL" >> $GITHUB_OUTPUT

          if [ "${{ inputs.force }}" = "true" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
          elif docker manifest inspect ghcr.io/linktools-toolkit/aionui:$TAG > /dev/null 2>&1; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check
    if: needs.check.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout (for Dockerfile)
        uses: actions/checkout@v4

      - name: Download release asset
        run: |
          curl -fL "${{ needs.check.outputs.asset-url }}" -o aionui.tar.gz
          mkdir -p dist
          tar -xzf aionui.tar.gz --strip-components=1 -C dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .github/dockerfiles/aionui.Dockerfile
          push: true
          tags: |
            ghcr.io/linktools-toolkit/aionui:${{ needs.check.outputs.tag }}
            ghcr.io/linktools-toolkit/aionui:${{ needs.check.outputs.channel }}
            ghcr.io/linktools-toolkit/aionui:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
