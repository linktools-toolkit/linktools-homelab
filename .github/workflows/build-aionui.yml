name: Build AionUI

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'AionUI tag to build (leave empty to use latest release)'
        required: false
      force:
        description: 'Force rebuild even if image already exists'
        required: false
        default: 'false'
        type: boolean

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      channel: ${{ steps.resolve.outputs.channel }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release info
        id: resolve
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            RELEASE=$(curl -sf "https://api.github.com/repos/iOfficeAI/AionUi/releases/tags/${{ inputs.tag }}")
          else
            RELEASE=$(curl -sf "https://api.github.com/repos/iOfficeAI/AionUi/releases" | jq 'first')
          fi

          TAG=$(echo "$RELEASE" | jq -r .tag_name)
          VERSION=$(echo "$TAG" | sed 's/^v//' | cut -d'-' -f1)
          IS_PRERELEASE=$(echo "$RELEASE" | jq -r .prerelease)
          CHANNEL=$([ "$IS_PRERELEASE" = "true" ] && echo "preview" || echo "stable")

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT

          if [ "${{ inputs.force }}" = "true" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
          elif docker manifest inspect ghcr.io/linktools-toolkit/aionui:$TAG > /dev/null 2>&1; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check
    if: needs.check.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout (for Dockerfile)
        uses: actions/checkout@v4

      - name: Checkout AionUI source
        uses: actions/checkout@v4
        with:
          repository: iOfficeAI/AionUi
          ref: ${{ needs.check.outputs.tag }}
          path: aionui-src

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build AionUI web CLI
        working-directory: aionui-src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun install --frozen-lockfile
          NODE_OPTIONS=--max-old-space-size=8192 bunx electron-vite build --config packages/desktop/electron.vite.config.ts
          PACK_PLATFORM=linux PACK_ARCH=x64 node scripts/pack-web-cli.js

      - name: Prepare Docker build context
        run: |
          TARBALL=$(find aionui-src/dist-web-cli -maxdepth 1 -type f -name 'aionui-web-*-linux-x86_64.tar.gz' -print -quit)
          if [ -z "$TARBALL" ]; then
            echo "AionUI web CLI tarball not found" >&2
            exit 1
          fi

          mkdir -p dist
          tar -xzf "$TARBALL" --strip-components=1 -C dist
          test -x dist/aionui-web
          rm -rf aionui-src

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Render Dockerfile
        run: bash .github/scripts/render-dockerfile.sh .github/dockerfiles/aionui.Dockerfile > /tmp/aionui.Dockerfile

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: /tmp/aionui.Dockerfile
          push: true
          provenance: false
          tags: |
            ghcr.io/linktools-toolkit/aionui:${{ needs.check.outputs.tag }}
            ghcr.io/linktools-toolkit/aionui:${{ needs.check.outputs.channel }}
            ghcr.io/linktools-toolkit/aionui:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cleanup:
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete untagged versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: aionui
          package-type: container
          delete-only-untagged-versions: true
