name: Build AionUI

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'AionUI tag to build (leave empty to use latest release)'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      channel: ${{ steps.resolve.outputs.channel }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - name: Resolve tag and channel
        id: resolve
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
            RELEASE=$(curl -sf "https://api.github.com/repos/iOfficeAI/AionUi/releases/tags/$TAG")
          else
            RELEASE=$(curl -sf https://api.github.com/repos/iOfficeAI/AionUi/releases | jq 'first')
            TAG=$(echo "$RELEASE" | jq -r .tag_name)
          fi

          IS_PRERELEASE=$(echo "$RELEASE" | jq -r .prerelease)
          if [ "$IS_PRERELEASE" = "true" ]; then
            CHANNEL="preview"
          else
            CHANNEL="stable"
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT

          if docker manifest inspect ghcr.io/linktools-toolkit/aionui:$TAG > /dev/null 2>&1; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check
    if: needs.check.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout AionUI source
        uses: actions/checkout@v4
        with:
          repository: iOfficeAI/AionUi
          ref: ${{ needs.check.outputs.tag }}

      - name: Patch trust proxy
        run: |
          sed -i "s/const app = express();/const app = express();\n  app.set('trust proxy', true);/" \
            src/process/webserver/index.ts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/linktools-toolkit/aionui:${{ needs.check.outputs.tag }}
            ghcr.io/linktools-toolkit/aionui:${{ needs.check.outputs.channel }}
            ghcr.io/linktools-toolkit/aionui:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
