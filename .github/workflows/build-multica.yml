name: Build Multica

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-multica.yml'
      - '.github/docker/multica/**'
  schedule:
    - cron: '35 2 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Multica CLI release tag (leave empty to use latest)'
        required: false
      force:
        description: 'Force rebuild even if image already exists'
        required: false
        default: 'false'
        type: boolean

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release and check image
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG=$(curl -fsSL https://api.github.com/repos/multica-ai/multica/releases/latest | jq -r .tag_name)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [ "$FORCE" = "true" ] || [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif docker manifest inspect "ghcr.io/linktools-toolkit/multica:$TAG" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .github/docker/multica/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            MULTICA_VERSION=${{ needs.check.outputs.tag }}
          tags: |
            ghcr.io/linktools-toolkit/multica:${{ needs.check.outputs.tag }}
            ghcr.io/linktools-toolkit/multica:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cleanup:
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete untagged versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: multica
          package-type: container
          delete-only-untagged-versions: true
