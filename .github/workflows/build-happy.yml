name: Build Happy Server

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'happy tag to build (leave empty to use latest release)'
        required: false
      force:
        description: 'Force rebuild even if image already exists'
        required: false
        default: 'false'
        type: boolean

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - name: Resolve tag and check existence
        id: resolve
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG=$(curl -sf https://api.github.com/repos/slopus/happy/releases/latest | jq -r .tag_name)
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          if [ "${{ inputs.force }}" = "true" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
          elif docker manifest inspect ghcr.io/linktools-toolkit/happy-server:$TAG > /dev/null 2>&1; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check
    if: needs.check.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout happy source
        uses: actions/checkout@v4
        with:
          repository: slopus/happy
          ref: ${{ needs.check.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ghcr.io/linktools-toolkit/happy-server:${{ needs.check.outputs.tag }}
            ghcr.io/linktools-toolkit/happy-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cleanup:
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete untagged versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: happy-server
          package-type: container
          delete-only-untagged-versions: true
